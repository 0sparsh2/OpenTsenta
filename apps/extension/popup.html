<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body { width: 300px; margin: 0; font-family: -apple-system, "Segoe UI", Inter, sans-serif; color: #0e1b2c; background: #f6f4ef; }
      header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: #0e1b2c; color: #f6f4ef; font-weight: 650; }
      main { padding: 14px; }
      .status { padding: 10px 12px; border-radius: 10px; background: #fff; border: 1px solid #e6e1d7; font-size: 13px; }
      .on { color: #1f8a5b; } .off { color: #c2413b; }
      label { display: block; margin: 12px 0 4px; font-size: 12px; font-weight: 600; color: #2a3a4f; }
      input { width: 100%; height: 32px; border: 1px solid #e6e1d7; border-radius: 8px; padding: 0 9px; font-size: 12.5px; }
      button { margin-top: 12px; width: 100%; height: 34px; border-radius: 9px; border: 0; background: #0e1b2c; color: #f6f4ef; font-weight: 600; cursor: pointer; }
      button.ghost { background: #fff; color: #0e1b2c; border: 1px solid #e6e1d7; }
      p.hint { font-size: 11.5px; color: #66717f; margin: 10px 0 0; line-height: 1.4; }
    </style>
  </head>
  <body>
    <header><img src="icons/48.png" width="20" height="20" alt="" /> Ferry</header>
    <main>
      <div class="status" id="status">Checking…</div>
      <button id="open">Open dashboard</button>
      <label for="api">Server</label>
      <input id="api" placeholder="http://localhost:8787" />
      <label for="token">API token</label>
      <input id="token" placeholder="Picked up from the dashboard automatically" />
      <button class="ghost" id="save">Save</button>
      <p class="hint">Open any job posting (Greenhouse, Lever, Ashby, Workday, or a page with JobPosting markup) and a Ferry panel appears in the corner.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
