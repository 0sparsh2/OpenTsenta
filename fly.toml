# One-time setup (pick your own app name; the URL becomes https://<app>.fly.dev):
#   fly launch --copy-config --no-deploy --name <app>
#   fly volumes create ferry_data --size 3 --region sjc
#   fly secrets set PUBLIC_URL=https://<app>.fly.dev NVIDIA_NIM_API_KEY=nvapi-...   (optional: RESEND_API_KEY, STRIPE_SECRET_KEY; see .env.example)
#   fly deploy
# Then connect Claude: claude.ai → Settings → Connectors → Add custom connector → https://<app>.fly.dev/api/v1/mcp
app = "ferry-jobs"
primary_region = "sjc"

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  AUTH_MODE = "password"
  HEADLESS = "true"

[[mounts]]
  source = "ferry_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # the watcher and apply agent run continuously
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "2gb"
  cpus = 2
